<h2>第 5 页面 · 3D 相册</h2>
<p class="subtitle">点击相册卡片时的翻转效果</p>

<div class="cards">
  <div class="card" data-choice="flip-3d" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background: #0a0a0a; height: 100px; display: flex; align-items: center; justify-content: center; perspective: 300px;">
        <div style="width: 50px; height: 70px; background: linear-gradient(135deg, #ef4444, #dc2626); border-radius: 6px; transform: rotateY(-30deg); box-shadow: 10px 10px 30px rgba(0,0,0,0.5);">
          <div style="position: absolute; width: 50px; height: 70px; background: linear-gradient(135deg, #ef4444, #dc2626); border-radius: 6px; transform: rotateY(-30deg); backface-visibility: hidden;"></div>
          <div style="position: absolute; width: 50px; height: 70px; background: #1f2937; border-radius: 6px; transform: rotateY(150deg); backface-visibility: hidden; display: flex; align-items: center; justify-content: center; color: white; font-size: 8px; text-align: center; padding: 4px;">春节·大理</div>
        </div>
      </div>
      <div style="font-size: 11px; color: #6b7280; padding: 6px; text-align: center;">翻转后显示相册信息</div>
    </div>
    <div class="card-body">
      <h3>3D 翻转卡片</h3>
      <p>正面照片 → 翻转 → 背面显示相册名称/描述/照片数</p>
    </div>
  </div>

  <div class="card" data-choice="stack-reveal" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background: #0a0a0a; height: 100px; display: flex; align-items: center; justify-content: center; perspective: 300px;">
        <div style="position: absolute; width: 50px; height: 70px; background: linear-gradient(135deg, #4b5563, #374151); border-radius: 6px; transform: rotateZ(5deg) translateY(5px);"></div>
        <div style="position: absolute; width: 50px; height: 70px; background: linear-gradient(135deg, #6b7280, #4b5563); border-radius: 6px; transform: rotateZ(2deg) translateY(2px);"></div>
        <div style="position: absolute; width: 50px; height: 70px; background: linear-gradient(135deg, #ef4444, #dc2626); border-radius: 6px; box-shadow: 0 10px 30px rgba(239,68,68,0.3);"></div>
      </div>
      <div style="font-size: 11px; color: #6b7280; padding: 6px; text-align: center;">堆叠效果，点击展开照片列表</div>
    </div>
    <div class="card-body">
      <h3>堆叠展开</h3>
      <p>卡片像扑克牌堆叠，点击展开显示该相册所有照片</p>
    </div>
  </div>

  <div class="card" data-choice="hover-3d" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background: #0a0a0a; height: 100px; display: flex; align-items: center; justify-content: center; perspective: 300px;">
        <div style="width: 55px; height: 75px; background: linear-gradient(135deg, #ef4444, #dc2626); border-radius: 8px; transform: rotateX(10deg) rotateY(15deg); transition: transform 0.3s; box-shadow: 0 20px 40px rgba(239,68,68,0.2);">
        </div>
      </div>
      <div style="font-size: 11px; color: #6b7280; padding: 6px; text-align: center;">悬停时 3D 倾斜，鼠标位置决定倾斜方向</div>
    </div>
    <div class="card-body">
      <h3>3D 悬浮倾斜</h3>
      <p>悬停时卡片根据鼠标位置 3D 倾斜，无需点击翻转</p>
    </div>
  </div>
</div>
