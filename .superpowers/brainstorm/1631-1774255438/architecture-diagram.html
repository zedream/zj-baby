<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>系统架构图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f1117; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 40px 20px; }
  h1 { text-align: center; font-size: 22px; font-weight: 600; color: #f8fafc; margin-bottom: 8px; }
  p.sub { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 40px; }
</style>
</head>
<body>
<h1>系统架构图</h1>
<p class="sub">Nuxt 3 SSR · SQLite · GitHub · Cloudflare Pages</p>

<div style="overflow-x: auto;">
<svg width="960" height="700" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto;">

  <!-- ====== USER LAYER ====== -->
  <rect x="20" y="20" width="920" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="480" y="50" text-anchor="middle" fill="#64748b" font-size="11" letter-spacing="2">USER LAYER · 用户层</text>

  <rect x="60" y="90" width="180" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="120" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">🌐 浏览器</text>
  <text x="150" y="137" text-anchor="middle" fill="#64748b" font-size="10">Browser / SSR</text>

  <rect x="380" y="90" width="180" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="470" y="120" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">📱 微信小程序</text>
  <text x="470" y="137" text-anchor="middle" fill="#64748b" font-size="10">Future · 未来扩展</text>

  <!-- Visitor ID cookie annotation -->
  <rect x="60" y="160" width="180" height="26" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="150" y="178" text-anchor="middle" fill="#a78bfa" font-size="10">cookie: visitorId</text>

  <!-- ====== NUXT SSR ====== -->
  <rect x="20" y="210" width="920" height="200" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="480" y="234" text-anchor="middle" fill="#64748b" font-size="11" letter-spacing="2">NUXT 3 SSR APPLICATION · Nuxt 3 全栈应用</text>

  <!-- Frontend Pages -->
  <rect x="40" y="254" width="200" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="254" width="200" height="28" rx="8" fill="#3b82f6" opacity="0.8"/>
  <rect x="40" y="270" width="200" height="12" fill="#3b82f6" opacity="0.8"/>
  <text x="140" y="272" text-anchor="middle" fill="white" font-size="11" font-weight="600">📄 前端页面</text>

  <text x="60" y="295" fill="#94a3b8" font-size="10">/ (首页 · 3D星轨+轮播)</text>
  <text x="60" y="313" fill="#94a3b8" font-size="10">/gallery (瀑布流)</text>
  <text x="60" y="331" fill="#94a3b8" font-size="10">/timeline (时间线)</text>
  <text x="60" y="349" fill="#94a3b8" font-size="10">/photo/:id (3D照片浏览)</text>
  <text x="60" y="367" fill="#94a3b8" font-size="10">/album/:id (翻转卡片)</text>
  <text x="60" y="385" fill="#f59e0b" font-size="10">fullPage.js · Three.js</text>

  <!-- Admin -->
  <rect x="260" y="254" width="160" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="260" y="254" width="160" height="28" rx="8" fill="#ef4444" opacity="0.8"/>
  <rect x="260" y="270" width="160" height="12" fill="#ef4444" opacity="0.8"/>
  <text x="340" y="272" text-anchor="middle" fill="white" font-size="11" font-weight="600">⚙️ /admin 后台</text>

  <text x="280" y="295" fill="#94a3b8" font-size="10">/admin/dashboard</text>
  <text x="280" y="313" fill="#94a3b8" font-size="10">/admin/albums</text>
  <text x="280" y="331" fill="#94a3b8" font-size="10">/admin/photos</text>
  <text x="280" y="349" fill="#94a3b8" font-size="10">/admin/tags</text>
  <text x="280" y="367" fill="#94a3b8" font-size="10">/admin/users</text>
  <text x="280" y="385" fill="#f59e0b" font-size="10">仅 admin 角色</text>

  <!-- API Server -->
  <rect x="460" y="254" width="180" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="460" y="254" width="180" height="28" rx="8" fill="#10b981" opacity="0.8"/>
  <rect x="460" y="270" width="180" height="12" fill="#10b981" opacity="0.8"/>
  <text x="550" y="272" text-anchor="middle" fill="white" font-size="11" font-weight="600">🔌 API 服务端</text>

  <text x="480" y="295" fill="#94a3b8" font-size="10">POST /api/auth/register</text>
  <text x="480" y="313" fill="#94a3b8" font-size="10">POST /api/auth/login</text>
  <text x="480" y="331" fill="#94a3b8" font-size="10">GET/POST /api/albums</text>
  <text x="480" y="349" fill="#94a3b8" font-size="10">GET/POST /api/photos</text>
  <text x="480" y="367" fill="#94a3b8" font-size="10">POST /api/favorites/merge</text>
  <text x="480" y="385" fill="#f59e0b" font-size="10">JWT · RBAC 中间件</text>

  <!-- Auth -->
  <rect x="660" y="254" width="140" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="660" y="254" width="140" height="28" rx="8" fill="#a78bfa" opacity="0.8"/>
  <rect x="660" y="270" width="140" height="12" fill="#a78bfa" opacity="0.8"/>
  <text x="730" y="272" text-anchor="middle" fill="white" font-size="11" font-weight="600">🔐 认证鉴权</text>

  <text x="680" y="295" fill="#94a3b8" font-size="10">visitorId 生成</text>
  <text x="680" y="313" fill="#94a3b8" font-size="10">JWT 签发/验证</text>
  <text x="680" y="331" fill="#94a3b8" font-size="10">RBAC 权限校验</text>
  <text x="680" y="349" fill="#94a3b8" font-size="10">收藏合并逻辑</text>
  <text x="680" y="367" fill="#94a3b8" font-size="10">Cookie: visitorId</text>
  <text x="680" y="385" fill="#f59e0b" font-size="10">合并后清除?</text>

  <!-- Server Utils -->
  <rect x="820" y="254" width="110" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="820" y="254" width="110" height="28" rx="8" fill="#06b6d4" opacity="0.8"/>
  <rect x="820" y="270" width="110" height="12" fill="#06b6d4" opacity="0.8"/>
  <text x="875" y="272" text-anchor="middle" fill="white" font-size="11" font-weight="600">🛠️ Server Utils</text>

  <text x="835" y="295" fill="#94a3b8" font-size="10">Drizzle ORM</text>
  <text x="835" y="313" fill="#94a3b8" font-size="10">SQLite Client</text>
  <text x="835" y="331" fill="#94a3b8" font-size="10">UUID Generator</text>
  <text x="835" y="349" fill="#94a3b8" font-size="10">Password Hash</text>
  <text x="835" y="367" fill="#94a3b8" font-size="10">Image Processor</text>
  <text x="835" y="385" fill="#f59e0b" font-size="10">GitHub API</text>

  <!-- ====== DATA LAYER ====== -->
  <rect x="20" y="430" width="920" height="100" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="480" y="454" text-anchor="middle" fill="#64748b" font-size="11" letter-spacing="2">DATA LAYER · 数据层</text>

  <!-- SQLite -->
  <rect x="40" y="474" width="180" height="44" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="130" y="496" text-anchor="middle" fill="#10b981" font-size="12" font-weight="600">🗄️ SQLite</text>
  <text x="130" y="510" text-anchor="middle" fill="#64748b" font-size="9">本地数据库</text>

  <!-- Photo Storage -->
  <rect x="240" y="474" width="180" height="44" rx="8" fill="#1e293b" stroke="#6b7280" stroke-width="1.5"/>
  <text x="330" y="496" text-anchor="middle" fill="#9ca3af" font-size="12" font-weight="600">📁 /public/photos</text>
  <text x="330" y="510" text-anchor="middle" fill="#64748b" font-size="9">本地照片缓存</text>

  <!-- GitHub -->
  <rect x="460" y="474" width="180" height="44" rx="8" fill="#1e293b" stroke="#6b7280" stroke-width="1.5"/>
  <text x="550" y="496" text-anchor="middle" fill="#9ca3af" font-size="12" font-weight="600">🐙 GitHub Repository</text>
  <text x="550" y="510" text-anchor="middle" fill="#64748b" font-size="9">photos/ · albums.json</text>

  <!-- Visitor in DB -->
  <rect x="660" y="474" width="130" height="44" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="725" y="496" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">👤 Visitor 表</text>
  <text x="725" y="510" text-anchor="middle" fill="#64748b" font-size="9">Pending 收藏</text>

  <!-- Favorites -->
  <rect x="810" y="474" width="130" height="44" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="875" y="496" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="600">⭐ Favorite 表</text>
  <text x="875" y="510" text-anchor="middle" fill="#64748b" font-size="9">status: pending/merged</text>

  <!-- ====== CDN LAYER ====== -->
  <rect x="20" y="550" width="920" height="80" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="574" text-anchor="middle" fill="#64748b" font-size="11" letter-spacing="2">CDN & DEPLOYMENT · 分发层</text>

  <!-- Cloudflare -->
  <rect x="40" y="594" width="200" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="140" y="611" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="600">☁️ Cloudflare Pages</text>

  <rect x="260" y="594" width="220" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="370" y="611" text-anchor="middle" fill="#94a3b8" font-size="10">自动部署 · 全球 CDN 加速</text>

  <rect x="500" y="594" width="200" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="611" text-anchor="middle" fill="#94a3b8" font-size="10">无限带宽 · 边缘节点</text>

  <rect x="720" y="594" width="220" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="830" y="611" text-anchor="middle" fill="#94a3b8" font-size="10">自定义域名 · SSL</text>

  <!-- ====== ARROW ANNOTATIONS ====== -->

  <!-- User → Nuxt -->
  <line x1="150" y1="150" x2="150" y2="210" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="146,200 150,210 154,200" fill="#3b82f6"/>
  <text x="170" y="185" fill="#64748b" font-size="9">SSR / CSR</text>

  <!-- Nuxt → SQLite -->
  <line x1="130" y1="394" x2="130" y2="430" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="126,420 130,430 134,420" fill="#10b981"/>
  <text x="148" y="413" fill="#64748b" font-size="9">Drizzle ORM</text>

  <!-- Nuxt → GitHub -->
  <line x1="550" y1="394" x2="550" y2="430" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="546,420 550,430 554,420" fill="#6b7280"/>
  <text x="558" y="413" fill="#64748b" font-size="9">upload photos</text>

  <!-- Nuxt → Cloudflare -->
  <line x1="140" y1="394" x2="140" y2="430" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="140" y1="430" x2="140" y2="530" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="136,560 140,570 144,560" fill="#f59e0b"/>
  <text x="155" y="500" fill="#64748b" font-size="9">read CDN URL</text>

  <!-- GitHub → Cloudflare deploy -->
  <path d="M 550 518 L 550 540 L 450 540 L 450 594" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 3" fill="none"/>
  <polygon points="446,584 450,594 454,584" fill="#6b7280"/>
  <text x="560" y="560" fill="#6b7280" font-size="9">自动部署触发</text>

  <!-- Cloudflare → User -->
  <line x1="140" y1="570" x2="150" y2="570" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="80" y="568" fill="#64748b" font-size="9">照片 CDN URL →</text>

  <!-- ====== VISITOR FLOW ====== -->
  <path d="M 150 y1=186 L 730 294" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 2" fill="none"/>
  <text x="400" y="245" fill="#a78bfa" font-size="9">cookie: visitorId</text>

  <!-- ====== LEGEND ====== -->
  <rect x="20" y="640" width="920" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="34" y="658" fill="#f8fafc" font-size="11" font-weight="600">图例</text>
  <line x1="34" y1="670" x2="74" y2="670" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="74,666 81,670 74,674" fill="#3b82f6"/>
  <text x="86" y="673" fill="#94a3b8" font-size="10">同步请求</text>
  <line x1="170" y1="670" x2="210" y2="670" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="206,666 210,670 206,674" fill="#10b981"/>
  <text x="216" y="673" fill="#94a3b8" font-size="10">数据库读写</text>
  <line x1="300" y1="670" x2="340" y2="670" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="336,666 340,670 336,674" fill="#f59e0b"/>
  <text x="346" y="673" fill="#94a3b8" font-size="10">CDN / 部署</text>
  <line x1="430" y1="670" x2="470" y2="670" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="466,666 470,670 466,674" fill="#6b7280"/>
  <text x="476" y="673" fill="#94a3b8" font-size="10">GitHub API</text>
  <line x1="560" y1="670" x2="600" y2="670" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="606" y="673" fill="#94a3b8" font-size="10">游客追踪</text>

</svg>
</div>
</body>
</html>
