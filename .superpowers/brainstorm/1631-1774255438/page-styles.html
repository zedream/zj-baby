<h2>瀑布流 · 时间线 · 照片页</h2>
<p class="subtitle">这三个页面的视觉风格</p>

<div class="section">
  <h3>瀑布流相册（作品集页面）</h3>
  <div class="options">
    <div class="option" data-choice="masonry-dark" onclick="toggleSelect(this)">
      <div class="letter">A</div>
      <div class="content">
        <h3>深色瀑布流</h3>
        <p>背景 #111，照片深色衬底上更突出</p>
      </div>
    </div>
    <div class="option" data-choice="masonry-light" onclick="toggleSelect(this)">
      <div class="letter">B</div>
      <div class="content">
        <h3>白色瀑布流</h3>
        <p>背景 #f9fafb，明亮干净，画册感</p>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h3>时间线页面</h3>
  <div class="options">
    <div class="option" data-choice="timeline-center" onclick="toggleSelect(this)">
      <div class="letter">A</div>
      <div class="content">
        <h3>中间时间轴</h3>
        <p>时间线在中间，照片上下交替排列</p>
      </div>
    </div>
    <div class="option" data-choice="timeline-left" onclick="toggleSelect(this)">
      <div class="letter">B</div>
      <div class="content">
        <h3>左侧时间轴</h3>
        <p>时间线固定左侧，照片统一在右侧</p>
      </div>
    </div>
    <div class="option" data-choice="timeline-horizontal" onclick="toggleSelect(this)">
      <div class="letter">C</div>
      <div class="content">
        <h3>横向滚动轴</h3>
        <p>整页横向滚动，年份/事件横向推进</p>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h3>单张照片沉浸式浏览</h3>
  <div class="options">
    <div class="option" data-choice="viewer-fullscreen" onclick="toggleSelect(this)">
      <div class="letter">A</div>
      <div class="content">
        <h3>全屏黑幕</h3>
        <p>照片全屏，黑色背景，简洁</p>
      </div>
    </div>
    <div class="option" data-choice="viewer-3d" onclick="toggleSelect(this)">
      <div class="letter">B</div>
      <div class="content">
        <h3>3D 透视</h3>
        <p>照片有透视倾斜，可缩放/旋转</p>
      </div>
    </div>
  </div>
</div>
