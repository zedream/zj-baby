<h2>视觉风格选择</h2>
<p class="subtitle">照片展示站的核心视觉基调</p>

<div class="cards">
  <div class="card" data-choice="dark" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background: #111; height: 120px; display: flex; align-items: center; justify-content: center; position: relative;">
        <div style="background: linear-gradient(135deg, #374151, #1f2937); width: 60px; height: 60px; border-radius: 8px; margin: 0 4px;"></div>
        <div style="background: linear-gradient(135deg, #4b5563, #374151); width: 60px; height: 80px; border-radius: 8px; margin: 0 4px;"></div>
        <div style="background: linear-gradient(135deg, #6b7280, #4b5563); width: 60px; height: 50px; border-radius: 8px; margin: 0 4px;"></div>
      </div>
      <div style="background: #1f2937; padding: 8px; font-size: 11px; color: #9ca3af; text-align: center;">深色背景 · 照片更突出</div>
    </div>
    <div class="card-body">
      <h3>深邃暗色</h3>
      <p>背景 #111 / 深灰，UI 极简，照片本身成为视觉焦点</p>
    </div>
  </div>

  <div class="card" data-choice="light" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background: #f9fafb; height: 120px; display: flex; align-items: center; justify-content: center; position: relative;">
        <div style="background: linear-gradient(135deg, #d1d5db, #e5e7eb); width: 60px; height: 60px; border-radius: 8px; margin: 0 4px;"></div>
        <div style="background: linear-gradient(135deg, #9ca3af, #d1d5db); width: 60px; height: 80px; border-radius: 8px; margin: 0 4px;"></div>
        <div style="background: linear-gradient(135deg, #6b7280, #9ca3af); width: 60px; height: 50px; border-radius: 8px; margin: 0 4px;"></div>
      </div>
      <div style="background: #f3f4f6; padding: 8px; font-size: 11px; color: #6b7280; text-align: center;">白色背景 · 干净画册感</div>
    </div>
    <div class="card-body">
      <h3>明亮干净</h3>
      <p>背景 #f9fafb，白色系，网格布局，画册/Pinterest 风格</p>
    </div>
  </div>

  <div class="card" data-choice="mixed" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background: linear-gradient(180deg, #0f0f0f 0%, #1a1a1a 100%); height: 120px; display: flex; align-items: center; justify-content: center; position: relative;">
        <div style="background: linear-gradient(135deg, #374151, #1f2937); width: 60px; height: 60px; border-radius: 8px; margin: 0 4px;"></div>
        <div style="background: linear-gradient(135deg, #4b5563, #374151); width: 60px; height: 80px; border-radius: 8px; margin: 0 4px;"></div>
        <div style="background: linear-gradient(135deg, #6b7280, #4b5563); width: 60px; height: 50px; border-radius: 8px; margin: 0 4px;"></div>
      </div>
      <div style="background: #111; padding: 8px; font-size: 11px; color: #9ca3af; text-align: center;">渐变深色顶部 · 沉浸感强</div>
    </div>
    <div class="card-body">
      <h3>混合风格</h3>
      <p>首页深色沉浸，瀑布流页面白色，分场景切换</p>
    </div>
  </div>
</div>

<p class="subtitle" style="margin-top: 16px; font-size: 12px; color: #9ca3af;">💡 提示：你之前说希望首页3D沉浸式，混合风格可以让首页更深色，其他页面更干净</p>
