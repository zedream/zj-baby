<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>状态图 · State Machine Diagram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f1117; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 40px 20px; }
  h1 { text-align: center; font-size: 22px; font-weight: 600; color: #f8fafc; margin-bottom: 8px; }
  p.sub { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 40px; }
</style>
</head>
<body>
<h1>状态图 · State Machine Diagram</h1>
<p class="sub">Favorite 实体状态流转 · pending → merged</p>

<div style="overflow-x: auto;">
<svg width="900" height="560" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto;">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#64748b"/>
    </marker>
    <marker id="arr-yellow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">⭐ Favorite 状态机</text>
  <text x="450" y="50" text-anchor="middle" fill="#64748b" font-size="12">photoId + visitorId / userId 唯一定位一条收藏记录</text>

  <!-- ========== PENDING STATE ========== -->
  <rect x="40" y="90" width="220" height="240" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2.5"/>
  <rect x="40" y="90" width="220" height="36" rx="12" fill="#a78bfa"/>
  <rect x="40" y="110" width="220" height="16" fill="#a78bfa"/>
  <text x="150" y="113" text-anchor="middle" fill="white" font-size="13" font-weight="700">⏳ Pending</text>
  <text x="150" y="113" text-anchor="middle" fill="white" font-size="13" font-weight="700">⏳ Pending</text>

  <!-- Entry action -->
  <text x="60" y="150" fill="#64748b" font-size="10">【进入时】</text>
  <rect x="55" y="158" width="190" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="150" y="175" text-anchor="middle" fill="#94a3b8" font-size="10">visitorId = cookie.id</text>

  <!-- Activities in pending -->
  <text x="60" y="205" fill="#64748b" font-size="10">【进行中】</text>
  <rect x="55" y="213" width="190" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="150" y="230" text-anchor="middle" fill="#94a3b8" font-size="10">记录 photoId + createdAt</text>
  <rect x="55" y="248" width="190" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="150" y="265" text-anchor="middle" fill="#94a3b8" font-size="10">userId = NULL</text>
  <rect x="55" y="283" width="190" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="150" y="300" text-anchor="middle" fill="#94a3b8" font-size="10">status = 'pending'</text>

  <!-- Exit action -->
  <text x="60" y="335" fill="#64748b" font-size="10">【退出时】</text>
  <rect x="55" y="343" width="190" height="26" rx="4" fill="#0f172a" stroke="#a78bfa" stroke-dasharray="4 2"/>
  <text x="150" y="360" text-anchor="middle" fill="#a78bfa" font-size="10">准备合并数据</text>

  <!-- ========== MERGED STATE ========== -->
  <rect x="640" y="90" width="220" height="240" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2.5"/>
  <rect x="640" y="90" width="220" height="36" rx="12" fill="#22c55e"/>
  <rect x="640" y="110" width="220" height="16" fill="#22c55e"/>
  <text x="750" y="113" text-anchor="middle" fill="white" font-size="13" font-weight="700">✅ Merged</text>

  <!-- Entry action -->
  <text x="660" y="150" fill="#64748b" font-size="10">【进入时】</text>
  <rect x="655" y="158" width="190" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="750" y="175" text-anchor="middle" fill="#94a3b8" font-size="10">userId = currentUser.id</text>
  <rect x="655" y="193" width="190" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="750" y="210" text-anchor="middle" fill="#94a3b8" font-size="10">mergedAt = NOW()</text>
  <rect x="655" y="228" width="190" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="750" y="245" text-anchor="middle" fill="#94a3b8" font-size="10">status = 'merged'</text>
  <rect x="655" y="263" width="190" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="750" y="280" text-anchor="middle" fill="#94a3b8" font-size="10">visitorId = NULL</text>

  <!-- Activities in merged -->
  <text x="660" y="305" fill="#64748b" font-size="10">【进行中】</text>
  <rect x="655" y="313" width="190" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="750" y="330" text-anchor="middle" fill="#94a3b8" font-size="10">归属用户，可取消收藏</text>

  <!-- ========== DELETED (TERMINAL) ========== -->
  <rect x="370" y="370" width="160" height="80" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="450" y="402" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="700">🗑️ Deleted</text>
  <text x="450" y="422" text-anchor="middle" fill="#64748b" font-size="10">终态</text>

  <!-- ========== STATE TRANSITIONS ========== -->

  <!-- P → M: User Login/Register -->
  <path d="M 260 160 Q 380 80 620 160" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#arr-yellow)"/>
  <rect x="370" y="65" width="200" height="46" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="470" y="82" text-anchor="middle" fill="#f59e0b" font-size="11">登录 / 注册</text>
  <text x="470" y="97" text-anchor="middle" fill="#64748b" font-size="10">POST /api/favorites/merge</text>

  <!-- P → Deleted -->
  <line x1="150" y1="330" x2="150" y2="370" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="60" y="345" width="120" height="20" rx="4" fill="#1e293b" stroke="#ef4444"/>
  <text x="120" y="359" text-anchor="middle" fill="#ef4444" font-size="10">游客取消收藏</text>

  <!-- M → Deleted -->
  <line x1="750" y1="330" x2="750" y2="370" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="660" y="345" width="120" height="20" rx="4" fill="#1e293b" stroke="#ef4444"/>
  <text x="720" y="359" text-anchor="middle" fill="#ef4444" font-size="10">用户取消收藏</text>

  <!-- P → P: Add more favorites -->
  <path d="M 60 210 Q 20 240 60 270" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#arr-purple)"/>
  <rect x="-60" y="230" width="90" height="30" rx="4" fill="#1e293b" stroke="#a78bfa"/>
  <text x="-15" y="245" text-anchor="middle" fill="#a78bfa" font-size="10">继续收藏</text>
  <text x="-15" y="257" text-anchor="middle" fill="#a78bfa" font-size="10">其他照片</text>

  <!-- P → M: Direct user favorite -->
  <path d="M 260 220 Q 380 220 620 220" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <rect x="380" y="200" width="160" height="30" rx="4" fill="#1e293b" stroke="#22c55e"/>
  <text x="460" y="217" text-anchor="middle" fill="#22c55e" font-size="10">已登录用户直接收藏</text>

  <!-- ========== LEGEND ========== -->
  <rect x="40" y="470" width="820" height="80" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="56" y="492" fill="#f8fafc" font-size="12" font-weight="600">图例</text>

  <!-- States -->
  <rect x="56" y="504" width="120" height="30" rx="15" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="116" y="523" text-anchor="middle" fill="#a78bfa" font-size="10">Pending 状态</text>
  <rect x="200" y="504" width="120" height="30" rx="15" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="260" y="523" text-anchor="middle" fill="#22c55e" font-size="10">Merged 状态</text>
  <rect x="344" y="504" width="100" height="30" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="394" y="523" text-anchor="middle" fill="#ef4444" font-size="10">终态</text>

  <!-- Transitions -->
  <line x1="470" y1="519" x2="510" y2="519" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-yellow)"/>
  <text x="516" y="523" fill="#94a3b8" font-size="10">合并触发</text>
  <line x1="600" y1="519" x2="640" y2="519" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="646" y="523" fill="#94a3b8" font-size="10">直接收藏</text>
  <line x1="700" y1="519" x2="740" y2="519" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="746" y="523" fill="#94a3b8" font-size="10">取消收藏</text>

  <!-- Transition label box -->
  <rect x="470" y="536" width="310" height="20" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="625" y="550" text-anchor="middle" fill="#64748b" font-size="9">【合并时去重】同 photoId 保留最早 createdAt，忽略后续</text>

</svg>
</div>
</body>
</html>
