<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ER 图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f1117; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 40px 20px; }
  h1 { text-align: center; font-size: 22px; font-weight: 600; color: #f8fafc; margin-bottom: 8px; }
  p.sub { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 40px; }
  .diagram { display: flex; flex-direction: column; align-items: center; gap: 60px; }
  svg { overflow: visible; }
  .entity { filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4)); }
</style>
</head>
<body>
<h1>数据库实体关系图 (ER Diagram)</h1>
<p class="sub">zj-baby 照片展示站</p>

<div class="diagram">
<svg width="1100" height="880" xmlns="http://www.w3.org/2000/svg">

  <!-- ======= ALBUM ======= -->
  <rect class="entity" x="20" y="20" width="210" height="260" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="20" y="20" width="210" height="36" rx="10" fill="#3b82f6"/>
  <rect x="20" y="42" width="210" height="14" fill="#3b82f6"/>
  <text x="125" y="44" text-anchor="middle" fill="white" font-size="14" font-weight="700">Album</text>

  <text x="34" y="74" fill="#94a3b8" font-size="11">id</text><text x="110" y="74" fill="#64748b" font-size="10">PK, UUID</text>
  <line x1="34" y1="79" x2="216" y2="79" stroke="#334155" stroke-width="1"/>
  <text x="34" y="92" fill="#94a3b8" font-size="11">name</text><text x="110" y="92" fill="#64748b" font-size="10">string</text>
  <line x1="34" y1="97" x2="216" y2="97" stroke="#334155" stroke-width="1"/>
  <text x="34" y="110" fill="#94a3b8" font-size="11">description</text><text x="110" y="110" fill="#64748b" font-size="10">string</text>
  <line x1="34" y1="115" x2="216" y2="115" stroke="#334155" stroke-width="1"/>
  <text x="34" y="128" fill="#94a3b8" font-size="11">coverPhotoId</text><text x="110" y="128" fill="#64748b" font-size="10">FK → Photo</text>
  <line x1="34" y1="133" x2="216" y2="133" stroke="#334155" stroke-width="1"/>
  <text x="34" y="146" fill="#94a3b8" font-size="11">visibility</text><text x="110" y="146" fill="#64748b" font-size="10">enum</text>
  <line x1="34" y1="151" x2="216" y2="151" stroke="#334155" stroke-width="1"/>
  <text x="34" y="164" fill="#94a3b8" font-size="11">ownerId</text><text x="110" y="164" fill="#64748b" font-size="10">FK → User</text>
  <line x1="34" y1="169" x2="216" y2="169" stroke="#334155" stroke-width="1"/>
  <text x="34" y="182" fill="#94a3b8" font-size="11">createdAt</text><text x="110" y="182" fill="#64748b" font-size="10">datetime</text>
  <line x1="34" y1="187" x2="216" y2="187" stroke="#334155" stroke-width="1"/>
  <text x="34" y="200" fill="#94a3b8" font-size="11">updatedAt</text><text x="110" y="200" fill="#64748b" font-size="10">datetime</text>
  <line x1="34" y1="205" x2="216" y2="205" stroke="#334155" stroke-width="1"/>
  <text x="34" y="218" fill="#f59e0b" font-size="10">PK = Primary Key</text>
  <text x="34" y="231" fill="#f59e0b" font-size="10">FK = Foreign Key</text>
  <text x="34" y="244" fill="#f59e0b" font-size="10">enum: public|private</text>
  <text x="34" y="257" fill="#f59e0b" font-size="10">  (登录可见)|private(本人)</text>

  <!-- ======= PHOTO ======= -->
  <rect class="entity" x="20" y="320" width="210" height="290" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <rect x="20" y="320" width="210" height="36" rx="10" fill="#10b981"/>
  <rect x="20" y="342" width="210" height="14" fill="#10b981"/>
  <text x="125" y="344" text-anchor="middle" fill="white" font-size="14" font-weight="700">Photo</text>

  <text x="34" y="374" fill="#94a3b8" font-size="11">id</text><text x="110" y="374" fill="#64748b" font-size="10">PK, UUID</text>
  <line x1="34" y1="379" x2="216" y2="379" stroke="#334155" stroke-width="1"/>
  <text x="34" y="392" fill="#94a3b8" font-size="11">albumId</text><text x="110" y="392" fill="#64748b" font-size="10">FK → Album</text>
  <line x1="34" y1="397" x2="216" y2="397" stroke="#334155" stroke-width="1"/>
  <text x="34" y="410" fill="#94a3b8" font-size="11">filename</text><text x="110" y="410" fill="#64748b" font-size="10">string</text>
  <line x1="34" y1="415" x2="216" y2="415" stroke="#334155" stroke-width="1"/>
  <text x="34" y="428" fill="#94a3b8" font-size="11">cdnUrl</text><text x="110" y="428" fill="#64748b" font-size="10">string</text>
  <line x1="34" y1="433" x2="216" y2="433" stroke="#334155" stroke-width="1"/>
  <text x="34" y="446" fill="#94a3b8" font-size="11">thumbnailUrl</text><text x="110" y="446" fill="#64748b" font-size="10">string</text>
  <line x1="34" y1="451" x2="216" y2="451" stroke="#334155" stroke-width="1"/>
  <text x="34" y="464" fill="#94a3b8" font-size="11">width / height</text><text x="110" y="464" fill="#64748b" font-size="10">int</text>
  <line x1="34" y1="469" x2="216" y2="469" stroke="#334155" stroke-width="1"/>
  <text x="34" y="482" fill="#94a3b8" font-size="11">takenAt</text><text x="110" y="482" fill="#64748b" font-size="10">datetime?</text>
  <line x1="34" y1="487" x2="216" y2="487" stroke="#334155" stroke-width="1"/>
  <text x="34" y="500" fill="#94a3b8" font-size="11">tags</text><text x="110" y="500" fill="#64748b" font-size="10">string[]</text>
  <line x1="34" y1="505" x2="216" y2="505" stroke="#334155" stroke-width="1"/>
  <text x="34" y="518" fill="#94a3b8" font-size="11">order</text><text x="110" y="518" fill="#64748b" font-size="10">int</text>
  <line x1="34" y1="523" x2="216" y2="523" stroke="#334155" stroke-width="1"/>
  <text x="34" y="536" fill="#94a3b8" font-size="11">createdAt</text><text x="110" y="536" fill="#64748b" font-size="10">datetime</text>
  <line x1="34" y1="541" x2="216" y2="541" stroke="#334155" stroke-width="1"/>
  <text x="34" y="554" fill="#f59e0b" font-size="10">? = optional</text>
  <text x="34" y="567" fill="#f59e0b" font-size="10">string[] via join table</text>

  <!-- ======= USER ======= -->
  <rect class="entity" x="390" y="20" width="210" height="220" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <rect x="390" y="20" width="210" height="36" rx="10" fill="#ef4444"/>
  <rect x="390" y="42" width="210" height="14" fill="#ef4444"/>
  <text x="495" y="44" text-anchor="middle" fill="white" font-size="14" font-weight="700">User</text>

  <text x="404" y="74" fill="#94a3b8" font-size="11">id</text><text x="480" y="74" fill="#64748b" font-size="10">PK, UUID</text>
  <line x1="404" y1="79" x2="596" y2="79" stroke="#334155" stroke-width="1"/>
  <text x="404" y="92" fill="#94a3b8" font-size="11">username</text><text x="480" y="92" fill="#64748b" font-size="10">string</text>
  <line x1="404" y1="97" x2="596" y2="97" stroke="#334155" stroke-width="1"/>
  <text x="404" y="110" fill="#94a3b8" font-size="11">email</text><text x="480" y="110" fill="#64748b" font-size="10">string, unique</text>
  <line x1="404" y1="115" x2="596" y2="115" stroke="#334155" stroke-width="1"/>
  <text x="404" y="128" fill="#94a3b8" font-size="11">passwordHash</text><text x="480" y="128" fill="#64748b" font-size="10">string</text>
  <line x1="404" y1="133" x2="596" y2="133" stroke="#334155" stroke-width="1"/>
  <text x="404" y="146" fill="#94a3b8" font-size="11">role</text><text x="480" y="146" fill="#64748b" font-size="10">enum: admin/user</text>
  <line x1="404" y1="151" x2="596" y2="151" stroke="#334155" stroke-width="1"/>
  <text x="404" y="164" fill="#94a3b8" font-size="11">createdAt</text><text x="480" y="164" fill="#64748b" font-size="10">datetime</text>
  <line x1="404" y1="169" x2="596" y2="169" stroke="#334155" stroke-width="1"/>
  <text x="404" y="182" fill="#f59e0b" font-size="10">role: admin/user</text>
  <text x="404" y="195" fill="#f59e0b" font-size="10">guest = no account</text>

  <!-- ======= VISITOR ======= -->
  <rect class="entity" x="390" y="280" width="210" height="140" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <rect x="390" y="280" width="210" height="36" rx="10" fill="#a78bfa"/>
  <rect x="390" y="302" width="210" height="14" fill="#a78bfa"/>
  <text x="495" y="304" text-anchor="middle" fill="white" font-size="14" font-weight="700">Visitor</text>

  <text x="404" y="334" fill="#94a3b8" font-size="11">id</text><text x="480" y="334" fill="#64748b" font-size="10">PK, UUID</text>
  <line x1="404" y1="339" x2="596" y2="339" stroke="#334155" stroke-width="1"/>
  <text x="404" y="352" fill="#94a3b8" font-size="11">createdAt</text><text x="480" y="352" fill="#64748b" font-size="10">datetime</text>
  <line x1="404" y1="357" x2="596" y2="357" stroke="#334155" stroke-width="1"/>
  <text x="404" y="370" fill="#f59e0b" font-size="10">≈ visitorId (UUID)</text>
  <text x="404" y="383" fill="#f59e0b" font-size="10">存于 cookie</text>

  <!-- ======= FAVORITE ======= -->
  <rect class="entity" x="390" y="460" width="210" height="210" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="390" y="460" width="210" height="36" rx="10" fill="#f59e0b"/>
  <rect x="390" y="482" width="210" height="14" fill="#f59e0b"/>
  <text x="495" y="484" text-anchor="middle" fill="white" font-size="14" font-weight="700">Favorite</text>

  <text x="404" y="514" fill="#94a3b8" font-size="11">id</text><text x="480" y="514" fill="#64748b" font-size="10">PK, UUID</text>
  <line x1="404" y1="519" x2="596" y2="519" stroke="#334155" stroke-width="1"/>
  <text x="404" y="532" fill="#94a3b8" font-size="11">photoId</text><text x="480" y="532" fill="#64748b" font-size="10">FK → Photo</text>
  <line x1="404" y1="537" x2="596" y2="537" stroke="#334155" stroke-width="1"/>
  <text x="404" y="550" fill="#94a3b8" font-size="11">visitorId</text><text x="480" y="550" fill="#64748b" font-size="10">FK → Visitor?</text>
  <line x1="404" y1="555" x2="596" y2="555" stroke="#334155" stroke-width="1"/>
  <text x="404" y="568" fill="#94a3b8" font-size="11">userId</text><text x="480" y="568" fill="#64748b" font-size="10">FK → User?</text>
  <line x1="404" y1="573" x2="596" y2="573" stroke="#334155" stroke-width="1"/>
  <text x="404" y="586" fill="#94a3b8" font-size="11">status</text><text x="480" y="586" fill="#64748b" font-size="10">pending/merged</text>
  <line x1="404" y1="591" x2="596" y2="591" stroke="#334155" stroke-width="1"/>
  <text x="404" y="604" fill="#94a3b8" font-size="11">createdAt</text><text x="480" y="604" fill="#64748b" font-size="10">datetime</text>
  <line x1="404" y1="609" x2="596" y2="609" stroke="#334155" stroke-width="1"/>
  <text x="404" y="622" fill="#94a3b8" font-size="11">mergedAt</text><text x="480" y="622" fill="#64748b" font-size="10">datetime?</text>
  <line x1="404" y1="627" x2="596" y2="627" stroke="#334155" stroke-width="1"/>
  <text x="404" y="640" fill="#f59e0b" font-size="10">visitorId ∨ userId</text>
  <text x="404" y="653" fill="#f59e0b" font-size="10">(二选一)</text>

  <!-- ======= TAG ======= -->
  <rect class="entity" x="390" y="700" width="210" height="160" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <rect x="390" y="700" width="210" height="36" rx="10" fill="#06b6d4"/>
  <rect x="390" y="722" width="210" height="14" fill="#06b6d4"/>
  <text x="495" y="724" text-anchor="middle" fill="white" font-size="14" font-weight="700">Tag</text>

  <text x="404" y="754" fill="#94a3b8" font-size="11">id</text><text x="480" y="754" fill="#64748b" font-size="10">PK, UUID</text>
  <line x1="404" y1="759" x2="596" y2="759" stroke="#334155" stroke-width="1"/>
  <text x="404" y="772" fill="#94a3b8" font-size="11">name</text><text x="480" y="772" fill="#64748b" font-size="10">string</text>
  <line x1="404" y1="777" x2="596" y2="777" stroke="#334155" stroke-width="1"/>
  <text x="404" y="790" fill="#94a3b8" font-size="11">slug</text><text x="480" y="790" fill="#64748b" font-size="10">string, unique</text>
  <line x1="404" y1="795" x2="596" y2="795" stroke="#334155" stroke-width="1"/>
  <text x="404" y="808" fill="#f59e0b" font-size="10">Photo ←→ Tag</text>
  <text x="404" y="821" fill="#f59e0b" font-size="10">via PhotoTag join</text>

  <!-- ======= PHOTO_TAG ======= -->
  <rect class="entity" x="660" y="700" width="170" height="100" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 3"/>
  <rect x="660" y="700" width="170" height="36" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="745" y="722" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">PhotoTag</text>
  <text x="674" y="754" fill="#94a3b8" font-size="11">photoId</text><text x="720" y="754" fill="#64748b" font-size="10">FK, PK</text>
  <line x1="674" y1="759" x2="816" y2="759" stroke="#334155" stroke-width="1"/>
  <text x="674" y="772" fill="#94a3b8" font-size="11">tagId</text><text x="720" y="772" fill="#64748b" font-size="10">FK, PK</text>
  <line x1="674" y1="777" x2="816" y2="777" stroke="#334155" stroke-width="1"/>
  <text x="674" y="790" fill="#f59e0b" font-size="10">join table</text>

  <!-- ======= RELATIONSHIP LINES ======= -->

  <!-- Album → Photo (1:N) -->
  <line x1="230" y1="400" x2="230" y2="450" stroke="#475569" stroke-width="1.5"/>
  <line x1="230" y1="450" x2="340" y2="450" stroke="#475569" stroke-width="1.5"/>
  <line x1="340" y1="450" x2="340" y2="400" stroke="#475569" stroke-width="1.5"/>
  <line x1="230" y1="400" x2="230" y2="355" stroke="#475569" stroke-width="1.5"/>
  <text x="237" y="395" fill="#64748b" font-size="10">1</text>
  <text x="237" y="420" fill="#64748b" font-size="10">N</text>
  <text x="238" y="377" fill="#94a3b8" font-size="9">has</text>

  <!-- Album.coverPhotoId → Photo (1:1 optional) -->
  <line x1="125" y1="280" x2="125" y2="310" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="130" y="295" fill="#64748b" font-size="9">1:1?</text>

  <!-- User → Album (1:N) -->
  <line x1="390" y1="120" x2="340" y2="120" stroke="#475569" stroke-width="1.5"/>
  <line x1="340" y1="120" x2="340" y2="150" stroke="#475569" stroke-width="1.5"/>
  <line x1="340" y1="150" x2="200" y2="150" stroke="#475569" stroke-width="1.5"/>
  <line x1="200" y1="150" x2="200" y2="180" stroke="#475569" stroke-width="1.5"/>
  <text x="335" y="117" fill="#64748b" font-size="10">1</text>
  <text x="330" y="140" fill="#64748b" font-size="10">N</text>
  <text x="270" y="147" fill="#94a3b8" font-size="9">owns</text>

  <!-- Photo → Favorite (1:N) -->
  <line x1="230" y1="580" x2="300" y2="580" stroke="#475569" stroke-width="1.5"/>
  <line x1="300" y1="580" x2="300" y2="540" stroke="#475569" stroke-width="1.5"/>
  <line x1="300" y1="540" x2="390" y2="540" stroke="#475569" stroke-width="1.5"/>
  <line x1="390" y1="540" x2="390" y2="530" stroke="#475569" stroke-width="1.5"/>
  <text x="237" y="575" fill="#64748b" font-size="10">1</text>
  <text x="290" y="563" fill="#64748b" font-size="10">N</text>
  <text x="290" y="552" fill="#94a3b8" font-size="9">← liked by</text>

  <!-- User → Favorite (1:N) -->
  <line x1="390" y1="200" x2="350" y2="200" stroke="#475569" stroke-width="1.5"/>
  <line x1="350" y1="200" x2="350" y2="400" stroke="#475569" stroke-width="1.5"/>
  <line x1="350" y1="400" x2="390" y2="400" stroke="#475569" stroke-width="1.5"/>
  <line x1="390" y1="400" x2="390" y2="430" stroke="#475569" stroke-width="1.5"/>
  <text x="378" y="197" fill="#64748b" font-size="10">1</text>
  <text x="373" y="300" fill="#64748b" font-size="10">N</text>
  <text x="358" y="350" fill="#94a3b8" font-size="9">likes</text>

  <!-- Visitor → Favorite (1:N) -->
  <line x1="390" y1="350" x2="360" y2="350" stroke="#475569" stroke-width="1.5"/>
  <line x1="360" y1="350" x2="360" y2="420" stroke="#475569" stroke-width="1.5"/>
  <line x1="360" y1="420" x2="390" y2="420" stroke="#475569" stroke-width="1.5"/>
  <line x1="390" y1="420" x2="390" y2="430" stroke="#475569" stroke-width="1.5"/>
  <text x="378" y="347" fill="#64748b" font-size="10">1</text>
  <text x="373" y="390" fill="#64748b" font-size="10">N</text>
  <text x="360" y="380" fill="#a78bfa" font-size="9">pending</text>

  <!-- PhotoTag → Tag -->
  <line x1="660" y1="750" x2="660" y2="760" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="660" y1="760" x2="600" y2="760" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="600" y1="760" x2="600" y2="820" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="630" y="757" fill="#64748b" font-size="10">N</text>
  <text x="610" y="773" fill="#64748b" font-size="10">1</text>

  <!-- Photo → PhotoTag -->
  <line x1="230" y1="610" x2="660" y2="750" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="660" y1="750" x2="660" y2="730" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="400" y="630" fill="#64748b" font-size="9">N:1</text>

  <!-- ======= LEGEND ======= -->
  <rect x="20" y="820" width="340" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="34" y="838" fill="#f8fafc" font-size="11" font-weight="600">图例</text>
  <line x1="34" y1="848" x2="74" y2="848" stroke="#475569" stroke-width="1.5"/><text x="80" y="851" fill="#94a3b8" font-size="10">关联关系</text>
  <line x1="34" y1="860" x2="74" y2="860" stroke="#3b82f6" stroke-width="1.5"/><text x="80" y="863" fill="#94a3b8" font-size="10">PK 主键</text>
  <line x1="180" y1="848" x2="220" y2="848" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 2"/><text x="226" y="851" fill="#94a3b8" font-size="10">FK 外键</text>
  <line x1="180" y1="860" x2="220" y2="860" stroke="#334155" stroke-width="1" stroke-dasharray="6 3"/><text x="226" y="863" fill="#94a3b8" font-size="10">Join Table</text>

  <!-- ======= RELATIONSHIP LABELS ======= -->
  <text x="240" y="448" fill="#64748b" font-size="9">albumId</text>

</svg>
</div>
</body>
</html>
